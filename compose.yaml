services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: vineyard
      POSTGRES_USER: vineyard
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vineyard -d vineyard"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
